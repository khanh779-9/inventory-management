# Chạy nguyên hệ thống: SQL Server + API + UI.
# Lần đầu: docker compose up --build -d, xem log API: docker compose logs -f api
# UI: http://localhost:4173   API: http://localhost:5080   Swagger: http://localhost:5080/swagger

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:-Strong_Passw0rd_2026}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: ./Backend/Inventory_Man_Sys_Be
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=InventoDb;User Id=sa;Password=${SQLSERVER_SA_PASSWORD:-Strong_Passw0rd_2026};TrustServerCertificate=True;Encrypt=False
      Database__AutoCreate: "true"
      Jwt__Key: ${JWT_KEY:-LOCAL_DEVELOPMENT_ONLY_CHANGE_THIS_KEY_2026_InventorySystem}
      # Trình duyệt mở UI trên cổng 4173 nên CORS phải cho phép origin đó
      Cors__AllowedOrigins__0: http://localhost:4173
      Cors__AllowedOrigins__1: http://127.0.0.1:4173
      Security__LoginRateLimit: 5
      Security__LoginRateWindowSeconds: 60
    ports:
      - "5080:8080"

  ui:
    build:
      context: ./Frontend
      args:
        # URL này chạy trên trình duyệt (nội dung .js của UI), không phải từ trong container
        VITE_API_BASE_URL: http://localhost:5080/api
    ports:
      - "4173:80"

volumes:
  sqlserver-data:
